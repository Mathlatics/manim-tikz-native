name: Temporary source audit

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply reviewed follow-up patch
        run: |
          python scripts/temporary_apply_followup_audit_patch.py
          git diff --check

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dvisvgm \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Validate patched tree
        env:
          PYTHONHASHSEED: random
        run: |
          python -m compileall -q tikz_native polyhedron_visibility tests
          python -m pip check
          python -m unittest discover -s tests -p "test_*.py"

      - name: Publish validated production changes and remove audit scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            docs/source-authoritative-projects.md \
            polyhedron_visibility/parallel_solver.py \
            tests/test_polyhedron_visibility_solver.py \
            tests/test_source_project.py \
            tests/test_tikz_native_component_revisions.py \
            tests/test_tikz_native_manim_codegen_3d.py \
            tests/test_tikz_native_motion_3d.py \
            tests/test_tikz_native_motion_3d_runtime.py \
            tikz_native/camera_3d.py \
            tikz_native/motion_3d_runtime.py \
            tikz_native/native_manim_codegen_3d.py \
            tikz_native/source_project.py \
            tikz_native/version.py
          git rm .github/workflows/temporary-source-audit.yml
          git rm scripts/temporary_apply_followup_audit_patch.py
          git diff --cached --check
          git commit -m "fix: harden projection validation across 3D runtimes"
          git push origin HEAD:chatgpt/project-audit-20260824
