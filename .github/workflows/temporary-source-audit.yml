name: Temporary source audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Create source-only archive
        run: git archive --format=zip --output=repository-source.zip HEAD
      - name: Upload source-only archive
        uses: actions/upload-artifact@v4
        with:
          name: repository-source-audit
          path: repository-source.zip
          if-no-files-found: error
          retention-days: 1
