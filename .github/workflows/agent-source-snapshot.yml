name: Agent source snapshot

on:
  push:
    branches:
      - agent/source-authoritative-build-pipeline

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
