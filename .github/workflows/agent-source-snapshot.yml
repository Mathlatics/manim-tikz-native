name: Apply closed-occlusion kernel migration

on:
  push:
    branches:
      - agent/migrate-auto-occlusion-kernel

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply locally validated migration
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          python - <<'PYCODE'
          import base64
          import gzip
          import os
          from pathlib import Path

          encoded = os.environ["PATCH_GZIP_BASE64"]
          Path("/tmp/pr4-migration.patch").write_bytes(
              gzip.decompress(base64.b64decode(encoded))
          )
          PYCODE
          git apply --check /tmp/pr4-migration.patch
          git apply /tmp/pr4-migration.patch
          rm -f .github/workflows/agent-source-snapshot.yml
          python -m compileall -q polyhedron_visibility tikz_native/version.py tests/test_geometry_kernel_layers.py tests/test_polyhedron_visibility_solver.py tests/test_polyhedron_visibility_manim_binding.py tests/test_tikz_native_component_revisions.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '.github/workflows/agent-source-snapshot.yml' 'CHANGELOG.md' 'docs/geometry-kernel-layers.md' 'polyhedron_visibility/kernel.py' 'polyhedron_visibility/parallel_solver.py' 'polyhedron_visibility/topology.py' 'polyhedron_visibility/visibility.py' 'tests/test_geometry_kernel_layers.py' 'tests/test_polyhedron_visibility_manim_binding.py' 'tests/test_polyhedron_visibility_solver.py' 'tests/test_tikz_native_component_revisions.py' 'tikz_native/version.py'
          git diff --cached --check
          git commit -m "refactor: migrate closed occlusion to shared kernel"
          git push
