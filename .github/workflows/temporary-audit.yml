name: Temporary deep audit

on:
  pull_request:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Create repository source snapshot
        run: git archive --format=zip --output=repository-source.zip HEAD

      - name: Upload repository source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: repository-source.zip
          if-no-files-found: error
          retention-days: 2

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply the locally reviewed patch
        run: |
          cat scripts/audit_patch/part-*.patch > /tmp/audit-fixes.patch
          echo "c02892eb784e7277f566c761fed7c0fe71cdc410bb4e9c46cb32c45b8b454d8a  /tmp/audit-fixes.patch" | sha256sum --check
          if git apply --check /tmp/audit-fixes.patch; then
            git apply /tmp/audit-fixes.patch
          elif git apply --reverse --check /tmp/audit-fixes.patch; then
            echo "Reviewed patch is already applied."
          else
            echo "Reviewed patch neither applies nor matches the current tree." >&2
            exit 1
          fi
          git diff --check

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dvisvgm \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install coverage ruff

      - name: Compile every Python module
        run: python -m compileall -q tikz_native polyhedron_visibility tests

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run tests with randomized hash order and coverage
        env:
          PYTHONHASHSEED: random
        run: |
          coverage run --branch -m unittest discover -s tests -p "test_*.py"
          coverage report --show-missing --skip-covered | tee coverage-report.txt

      - name: Probe geometry invariants
        run: python scripts/temporary_geometry_audit.py | tee geometry-audit.txt

      - name: Smoke-test public command entry points
        run: |
          tikz-native --help >/dev/null
          tikz-native-rig-2d --help >/dev/null
          tikz-native-rig-3d --help >/dev/null
          tikz-native-source-v3 --help >/dev/null
          tikz-native-project --help >/dev/null
          python -m tikz_native --help >/dev/null
          python -m tikz_native.source_project --help >/dev/null

      - name: Run correctness-oriented Ruff rules
        continue-on-error: true
        run: |
          ruff check tikz_native polyhedron_visibility tests \
            --select E9,F,B,PIE,PLE,RUF \
            --output-format concise | tee ruff-report.txt

      - name: Publish validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            docs/source-authoritative-projects.md \
            tests/test_source_project.py \
            tests/test_tikz_native_3d.py \
            tests/test_tikz_native_component_revisions.py \
            tests/test_tikz_native_geometry_rig_3d.py \
            tikz_native/geometry_rig_3d.py \
            tikz_native/projection_3d.py \
            tikz_native/source_project.py \
            tikz_native/version.py
          if git diff --cached --quiet; then
            echo "Validated production changes are already committed."
          else
            git commit -m "fix: harden projection and source-project conflicts"
            git push origin HEAD:chatgpt/project-audit-20260824
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit-reports
          path: |
            coverage-report.txt
            geometry-audit.txt
            ruff-report.txt
          if-no-files-found: warn
          retention-days: 2
