name: Temporary deep audit

on:
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Apply audited fixes in the working tree
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/temporary_apply_audit_fixes.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import importlib.util\n",
              "from types import ModuleType\n",
              1,
          )
          old = '''def _load_version(label: str):
              version_path = ROOT / "tikz_native/version.py"
              spec = importlib.util.spec_from_file_location(
                  f"_tikz_native_audit_version_{label}",
                  version_path,
              )
              if spec is None or spec.loader is None:
                  raise RuntimeError("cannot load tikz_native/version.py")
              version = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(version)
              return version
          '''
          new = '''def _load_version(label: str):
              version_path = ROOT / "tikz_native/version.py"
              module = ModuleType(f"_tikz_native_audit_version_{label}")
              module.__file__ = str(version_path)
              source = version_path.read_text(encoding="utf-8")
              exec(compile(source, str(version_path), "exec"), module.__dict__)
              return module
          '''
          if text.count(old) != 1:
              raise SystemExit("temporary revision loader block was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/temporary_apply_audit_fixes.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dvisvgm \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install coverage ruff

      - name: Compile every Python module
        run: python -m compileall -q tikz_native polyhedron_visibility tests

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run tests with randomized hash order and coverage
        env:
          PYTHONHASHSEED: random
        run: |
          coverage run --branch -m unittest discover -s tests -p "test_*.py"
          coverage report --show-missing --skip-covered

      - name: Probe geometry invariants
        run: python scripts/temporary_geometry_audit.py

      - name: Smoke-test public command entry points
        run: |
          tikz-native --help >/dev/null
          tikz-native-rig-2d --help >/dev/null
          tikz-native-rig-3d --help >/dev/null
          tikz-native-source-v3 --help >/dev/null
          tikz-native-project --help >/dev/null
          python -m tikz_native --help >/dev/null
          python -m tikz_native.source_project --help >/dev/null

      - name: Run correctness-oriented Ruff rules
        continue-on-error: true
        run: |
          ruff check tikz_native polyhedron_visibility tests \
            --select E9,F,B,PIE,PLE,RUF \
            --output-format concise

      - name: Check patch whitespace
        run: git diff --check

      - name: Publish validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/source-authoritative-projects.md \
            tests/test_source_project.py \
            tests/test_tikz_native_component_revisions.py \
            tests/test_tikz_native_geometry_rig_3d.py \
            tests/test_tikz_native_3d.py \
            tikz_native/geometry_rig_3d.py \
            tikz_native/projection_3d.py \
            tikz_native/source_project.py \
            tikz_native/version.py
          if git diff --cached --quiet; then
            echo "Audited fixes are already committed."
          else
            git commit -m "fix: harden projection and source-project conflicts"
            git push origin HEAD:chatgpt/project-audit-20260824
          fi
