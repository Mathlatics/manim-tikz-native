name: PR 12 Cairo evidence

on:
  push:
    branches:
      - diagnostics/pr12-cairo-evidence
    paths:
      - diagnostics/pr12_cairo_evidence/**
      - .github/workflows/pr12-cairo-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify production baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "a7811bf4f7d4adbf2e4078e30d647b40bea6693a" || true
          python - <<'PY'
          import manim
          from polyhedron_visibility.quadrics.manim import QuadricOcclusion3D
          print("manim", manim.__version__)
          print("production binding", QuadricOcclusion3D.__module__)
          PY

      - name: Render keyframes with Cairo
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/pr12-cairo-artifact"
          mkdir -p "$root/keyframes" "$root/videos" "$root/ffprobe"
          states=(mainly_behind intersects near_tangent exact_parabola mainly_front)
          for mode in translucent opaque; do
            for state in "${states[@]}"; do
              media="$RUNNER_TEMP/pr12-${mode}-${state}"
              PR12_DIAGNOSTIC_MODE="$mode" \
              PR12_DIAGNOSTIC_STATE="$state" \
                python -m manim \
                  --renderer cairo \
                  --disable_caching \
                  -r 960,540 \
                  --fps 24 \
                  -s \
                  --format png \
                  --media_dir "$media" \
                  diagnostics/pr12_cairo_evidence/scene.py \
                  CairoConeDiagnosticStill \
                  -o "${mode}_${state}"
              rendered="$(find "$media" -type f -name '*.png' -print -quit)"
              test -n "$rendered"
              cp "$rendered" "$root/keyframes/${mode}_${state}.png"
            done
          done

          media="$RUNNER_TEMP/pr12-surface-only"
          PR12_DIAGNOSTIC_MODE=surface_only \
          PR12_DIAGNOSTIC_STATE=exact_parabola \
            python -m manim \
              --renderer cairo \
              --disable_caching \
              -r 960,540 \
              --fps 24 \
              -s \
              --format png \
              --media_dir "$media" \
              diagnostics/pr12_cairo_evidence/scene.py \
              CairoConeDiagnosticStill \
              -o surface_only_exact_parabola
          rendered="$(find "$media" -type f -name '*.png' -print -quit)"
          test -n "$rendered"
          cp "$rendered" "$root/keyframes/surface_only_exact_parabola.png"

      - name: Render motion videos with Cairo
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/pr12-cairo-artifact"
          for mode in translucent opaque; do
            media="$RUNNER_TEMP/pr12-video-${mode}"
            PR12_DIAGNOSTIC_MODE="$mode" \
              python -m manim \
                --renderer cairo \
                --disable_caching \
                -r 960,540 \
                --fps 24 \
                --media_dir "$media" \
                diagnostics/pr12_cairo_evidence/scene.py \
                CairoConeDiagnosticVideo \
                -o "pr12_${mode}"
            rendered="$(find "$media" -type f -name '*.mp4' -print -quit)"
            test -n "$rendered"
            cp "$rendered" "$root/videos/pr12_${mode}.mp4"
            ffprobe -v error -show_streams -show_format -of json \
              "$root/videos/pr12_${mode}.mp4" \
              > "$root/ffprobe/pr12_${mode}.json"
          done

      - name: Analyze rendered pixels
        run: |
          python diagnostics/pr12_cairo_evidence/analyze.py \
            --artifact-dir "$GITHUB_WORKSPACE/pr12-cairo-artifact"

      - name: Inventory evidence
        run: |
          find pr12-cairo-artifact -type f -printf '%P\t%s bytes\n' | sort
          sed -n '1,240p' pr12-cairo-artifact/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: pr12-cairo-evidence
          path: pr12-cairo-artifact
          if-no-files-found: error
          retention-days: 30
