                  projected = corners @ IDENTITY_VIEW.matrix[:2].T
                  expected_length = sum(
                      float(np.linalg.norm(end - start))
                      for start, end in zip(
                          projected,
                          (*projected[1:], projected[0]),
                      )
                  )
                  actual_length = sum(
