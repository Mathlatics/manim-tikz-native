name: Apply PR 12 outline depth fix

on:
  push:
    branches:
      - codex/quadrics-v1
    paths:
      - .github/workflows/pr12-outline-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/quadrics-v1
          fetch-depth: 2

      - name: Recover and run reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          previous = subprocess.check_output(
              [
                  "git",
                  "show",
                  "HEAD^:.github/workflows/pr12-outline-fix.yml",
              ],
              text=True,
          )
          start = (
              "      - name: Apply reviewed outline fix\n"
              "        shell: bash\n"
              "        run: |\n"
          )
          end = "\n      - name: Commit fix\n"
          if start not in previous or end not in previous:
              raise RuntimeError("reviewed patch block is missing from the parent commit")
          block = previous.split(start, 1)[1].split(end, 1)[0]
          script = textwrap.dedent(block).lstrip("\n")
          Path("/tmp/apply-pr12-outline-fix.sh").write_text(
              script,
              encoding="utf-8",
          )
          PY
          bash -euxo pipefail /tmp/apply-pr12-outline-fix.sh

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            polyhedron_visibility/quadrics/section_compositing.py \
            polyhedron_visibility/quadrics/manim.py \
            tests/test_quadric_section_compositing.py \
            tests/test_quadric_section_manim.py
          git commit -m "fix: split quadric plane outlines by depth"
          git push origin HEAD:codex/quadrics-v1
