name: Apply validated PGF arithmetic fix

on:
  push:
    branches:
      - agent/harden-pgf-expression-errors

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[pgf fix applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply locally validated patch
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          python - <<'PYCODE'
          import base64, gzip, os
          from pathlib import Path
          payload = base64.b64decode(os.environ["PATCH_GZIP_BASE64"])
          Path("/tmp/pgf-fix.patch").write_bytes(gzip.decompress(payload))
          PYCODE
          git apply --check /tmp/pgf-fix.patch
          git apply /tmp/pgf-fix.patch
          rm -f .github/workflows/agent-apply-pgf-fix.yml
          python -m compileall -q tikz_native tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: fail closed on invalid PGF arithmetic [pgf fix applied]"
          git push
