name: Refresh validated PGF component revisions

on:
  push:
    branches:
      - agent/harden-pgf-expression-errors

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[revisions refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recompute component identities from the current source tree
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import re
          import runpy

          version_path = Path("tikz_native/version.py")
          tests_path = Path("tests/test_tikz_native_component_revisions.py")

          namespace = runpy.run_path(str(version_path))
          implementation_revisions = namespace[
              "provider_component_implementation_revisions"
          ]()
          digests = {
              component: revision.removeprefix("component-sha256:")
              for component, revision in implementation_revisions.items()
          }
          constant_by_component = {
              value: name
              for name, value in namespace.items()
              if name.startswith("COMPONENT_")
              and isinstance(value, str)
              and value in digests
          }
          if set(constant_by_component) != set(digests):
              missing = sorted(set(digests) - set(constant_by_component))
              raise SystemExit(f"missing component constants: {missing}")

          def replace_dict_values(
              text: str,
              *,
              start_marker: str,
              end_marker: str,
              value_prefix: str,
          ) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              block = text[start:end]
              for component, digest in digests.items():
                  constant = constant_by_component[component]
                  pattern = re.compile(
                      rf'({re.escape(constant)}\s*:\s*(?:\(\s*)?")([^"]+)(")'
                  )
                  replacement = rf'\g<1>{value_prefix}{digest}\g<3>'
                  block, count = pattern.subn(replacement, block, count=1)
                  if count != 1:
                      raise SystemExit(
                          f"could not update {constant} in {start_marker}"
                      )
              return text[:start] + block + text[end:]

          version_text = version_path.read_text(encoding="utf-8")
          version_text = replace_dict_values(
              version_text,
              start_marker="_PUBLIC_0_1_COMPONENT_REVISIONS",
              end_marker="\n\n\n_COMPONENT_DEFINITIONS",
              value_prefix="source-sha256:",
          )
          version_text = replace_dict_values(
              version_text,
              start_marker="_DECLARED_IMPLEMENTATION_DIGESTS",
              end_marker="\n\n\n_COMPONENT_NEUTRAL_FILES",
              value_prefix="",
          )
          version_path.write_text(version_text, encoding="utf-8")

          test_constant_by_component = {
              namespace["COMPONENT_ASSET_COMPILER"]: "ASSET_REVISION",
              namespace["COMPONENT_GEOMETRY_RIG_2D"]: "GEOMETRY_RIG_2D_REVISION",
              namespace["COMPONENT_NATIVE_MANIM_SOURCE_2D"]: "NATIVE_SOURCE_2D_REVISION",
              namespace["COMPONENT_NATIVE_RIG_2D"]: "NATIVE_RIG_2D_REVISION",
              namespace["COMPONENT_MOTION_PREVIEW_2D"]: "MOTION_PREVIEW_2D_REVISION",
              namespace["COMPONENT_GEOMETRY_RIG_3D"]: "GEOMETRY_RIG_3D_REVISION",
              namespace["COMPONENT_NATIVE_MANIM_SOURCE_3D"]: "NATIVE_SOURCE_3D_REVISION",
              namespace["COMPONENT_NATIVE_MANIM_SOURCE_3D_V2"]: "NATIVE_SOURCE_3D_V2_REVISION",
              namespace["COMPONENT_NATIVE_MANIM_SOURCE_3D_V3"]: "NATIVE_SOURCE_3D_V3_REVISION",
              namespace["COMPONENT_EMBEDDED_MOTION_3D"]: "EMBEDDED_MOTION_3D_REVISION",
              namespace["COMPONENT_MOTION_PREVIEW_3D"]: "MOTION_PREVIEW_3D_REVISION",
              namespace["COMPONENT_POLYHEDRON_VISIBILITY"]: "POLYHEDRON_VISIBILITY_REVISION",
              namespace["COMPONENT_FACE_DEPTH_CUE_3D"]: "FACE_DEPTH_CUE_3D_REVISION",
              namespace["COMPONENT_CONVEX_SECTION_3D"]: "CONVEX_SECTION_3D_REVISION",
              namespace["COMPONENT_COPY_IDENTITY_HANDOFF"]: "COPY_IDENTITY_HANDOFF_REVISION",
              namespace["COMPONENT_DERIVED_DIHEDRAL_VISIBILITY"]: "DERIVED_DIHEDRAL_VISIBILITY_REVISION",
              namespace["COMPONENT_OPEN_FACE_VISIBILITY"]: "OPEN_FACE_VISIBILITY_REVISION",
              namespace["COMPONENT_TIKZ_POLYHEDRON_VISIBILITY_3D"]: "TIKZ_POLYHEDRON_VISIBILITY_3D_REVISION",
              namespace["COMPONENT_TIKZ_CONVEX_SECTION_3D"]: "TIKZ_CONVEX_SECTION_3D_REVISION",
              namespace["COMPONENT_TIKZ_OPEN_FACE_VISIBILITY_3D"]: "TIKZ_OPEN_FACE_VISIBILITY_3D_REVISION",
              namespace["COMPONENT_TIKZ_OPEN_FACE_STATIC_ASSET_3D"]: "TIKZ_OPEN_FACE_STATIC_ASSET_3D_REVISION",
          }
          tests_text = tests_path.read_text(encoding="utf-8")
          for component, constant in test_constant_by_component.items():
              pattern = re.compile(
                  rf'({re.escape(constant)}\s*=\s*\(\s*")source-sha256:[0-9a-f]{{64}}("\s*\))'
              )
              replacement = rf'\g<1>source-sha256:{digests[component]}\g<2>'
              tests_text, count = pattern.subn(replacement, tests_text, count=1)
              if count != 1:
                  raise SystemExit(f"could not update test constant {constant}")
          tests_path.write_text(tests_text, encoding="utf-8")

          verified = runpy.run_path(str(version_path))
          actual = verified["provider_component_revisions"]()
          expected = {
              component: f"source-sha256:{digest}"
              for component, digest in digests.items()
          }
          if actual != expected:
              mismatch = {
                  component: (actual.get(component), expected[component])
                  for component in expected
                  if actual.get(component) != expected[component]
              }
              raise SystemExit(f"component revision verification failed: {mismatch}")
          PYCODE
          rm -f .github/workflows/agent-refresh-pgf-component-revisions.yml
          python -m compileall -q tikz_native tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: refresh PGF component identities [revisions refreshed]"
          git push
