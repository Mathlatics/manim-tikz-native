name: Extended Quadric Acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: extended-quadric-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extended-cairo:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dvisvgm \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex

      - name: Verify renderer toolchain
        run: |
          command -v xelatex
          command -v dvisvgm
          command -v ffmpeg
          command -v ffprobe
          command -v pdftoppm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install \
            build==1.6.0 \
            setuptools==84.0.0 \
            twine==7.0.0 \
            wheel==0.48.0

      - name: Rebuild and verify release manifest hashes
        run: |
          python release/verify_quadric_section_release.py \
            --evidence-json \
            "${RUNNER_TEMP}/quadric-section-acceptance/evidence/release-manifest-verification.json" \
            --failure-artifacts-directory \
            "${RUNNER_TEMP}/quadric-section-acceptance/evidence/release-build-failure-artifacts"

      - name: Run deferred full-render regressions
        run: |
          python scripts/run_ci_test_tier.py extended-cairo \
            --timings-json \
            "${RUNNER_TEMP}/quadric-section-acceptance/evidence/extended-test-timings.json"

      - name: Generate 960x540 evidence and videos
        run: |
          python scripts/generate_quadric_extended_acceptance.py \
            --output "${RUNNER_TEMP}/quadric-section-acceptance" \
            --render-videos

      - name: Upload exact acceptance evidence directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quadric-section-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/quadric-section-acceptance
          if-no-files-found: warn
          retention-days: 30
