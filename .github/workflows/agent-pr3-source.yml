name: Apply reviewed PR3 fixes

on:
  push:
    branches:
      - agent/unify-geometry-tolerance-layers

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: address geometry kernel review findings') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply locally validated files
        shell: bash
        env:
          PAYLOAD_B64: [... ELLIPSIZATION ...]
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 --decode > /tmp/pr3-fixes.tar.gz
          echo '09dd6d1bfda59d4e2f0fad72ef7ab9d0d78dd22d68f3db852650127903468a8e  /tmp/pr3-fixes.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/pr3-fixes.tar.gz
          rm -f .github/workflows/agent-pr3-source.yml
          python -m compileall -q polyhedron_visibility tikz_native tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/geometry-kernel-layers.md \
            polyhedron_visibility/__init__.py \
            polyhedron_visibility/geometry.py \
            polyhedron_visibility/visibility.py \
            polyhedron_visibility/kernel.py \
            tests/test_geometry_kernel_layers.py \
            tests/test_tikz_native_component_revisions.py \
            tikz_native/version.py \
            .github/workflows/agent-pr3-source.yml
          git diff --cached --check
          git commit -m 'fix: address geometry kernel review findings'
          git push
