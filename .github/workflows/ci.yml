name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Keep this job id and matrix stable: existing required checks are named
  # "test (3.11)" and "test (3.12)".
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dvisvgm \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex

      - name: Verify renderer toolchain
        run: |
          command -v xelatex
          command -v dvisvgm
          command -v ffmpeg
          command -v pdftoppm

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run renderer-neutral and low-resolution tests
        run: |
          python scripts/run_ci_test_tier.py core \
            --timings-json "${RUNNER_TEMP}/core-test-timings.json"

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  cairo-smoke:
    name: cairo-smoke (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dvisvgm \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex

      - name: Verify renderer toolchain
        run: |
          command -v xelatex
          command -v dvisvgm
          command -v ffmpeg
          command -v pdftoppm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Render the fixed small animation sample
        run: |
          python scripts/run_ci_test_tier.py cairo-smoke \
            --timings-json "${RUNNER_TEMP}/cairo-smoke-timings.json"
