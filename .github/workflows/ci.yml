name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Probe quadric component revisions
        run: |
          python - <<'PY'
          from tikz_native.version import (
              COMPONENT_QUADRIC_MANIM,
              COMPONENT_QUADRIC_VISIBILITY,
              provider_component_implementation_revisions,
          )

          revisions = provider_component_implementation_revisions()
          print(
              "QUADRIC_VISIBILITY_IMPLEMENTATION="
              + revisions[COMPONENT_QUADRIC_VISIBILITY],
              flush=True,
          )
          print(
              "QUADRIC_MANIM_IMPLEMENTATION="
              + revisions[COMPONENT_QUADRIC_MANIM],
              flush=True,
          )
          PY
          exit 1
