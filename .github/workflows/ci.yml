name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.head_ref == 'agent/unify-geometry-tolerance-layers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Diagnose the reviewed geometry-kernel payload
        shell: bash
        run: |
          python - <<'PYCODE'
          import string
          from pathlib import Path

          text = Path('.github/workflows/agent-pr3-source.yml').read_text(encoding='utf-8')
          marker = 'PAYLOAD_B64:'
          payload_block = text.split(marker, 1)[1]
          padding_end = payload_block.find('==')
          payload_text = ''.join(payload_block[:padding_end + 2].split())
          alphabet = set(string.ascii_letters + string.digits + '+/=')
          bad = [(index, character, ord(character)) for index, character in enumerate(payload_text) if character not in alphabet]
          print('payload length:', len(payload_text))
          print('payload prefix:', repr(payload_text[:80]))
          print('payload suffix:', repr(payload_text[-80:]))
          print('first invalid characters:', bad[:20])
          raise SystemExit('diagnostic run complete')
          PYCODE

  test:
    needs: apply-review-fixes
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped
