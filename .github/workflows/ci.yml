name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.head_ref == 'agent/unify-geometry-tolerance-layers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed component ownership and revision files
        shell: bash
        run: |
          cat .github/pr3-final-0.txt .github/pr3-final-1.txt \
            | tr -d '[:space:]' \
            | base64 --decode > /tmp/pr3-final.tar.gz
          echo '0168dbc9a6d7cff300b7891c1f0c22a43b4e3886cb2180f9b8240d06f75d3d9f  /tmp/pr3-final.tar.gz' \
            | sha256sum --check --strict
          python - <<'PYCODE'
          import tarfile
          from pathlib import Path

          expected = {
              'tikz_native/version.py',
              'tests/test_tikz_native_component_revisions.py',
          }
          with tarfile.open('/tmp/pr3-final.tar.gz', 'r:gz') as bundle:
              names = {member.name for member in bundle.getmembers()}
              if names != expected:
                  raise SystemExit(f'unexpected review-fix archive members: {sorted(names)!r}')
              for member in bundle.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'unsafe review-fix archive member: {member.name!r}')
              bundle.extractall('.')
          PYCODE
          rm -f \
            .github/workflows/agent-pr3-source.yml \
            .github/pr3-payload-1.txt \
            .github/pr3-final-0.txt \
            .github/pr3-final-1.txt
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python -m compileall -q polyhedron_visibility tikz_native tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/ci.yml \
            .github/workflows/agent-pr3-source.yml \
            .github/pr3-payload-1.txt \
            .github/pr3-final-0.txt \
            .github/pr3-final-1.txt \
            tikz_native/version.py \
            tests/test_tikz_native_component_revisions.py
          git diff --cached --check
          git commit -m 'fix: address geometry kernel review findings'
          git push origin HEAD:${{ github.head_ref }}

  test:
    needs: apply-review-fixes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dvisvgm \
            ffmpeg \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex

      - name: Verify renderer toolchain
        run: |
          command -v xelatex
          command -v dvisvgm
          command -v ffmpeg
          command -v pdftoppm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
