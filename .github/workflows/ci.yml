name: Update frozen quadric revisions

on:
  push:
    branches:
      - codex/quadrics-v1
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/quadrics-v1
          fetch-depth: 1

      - name: Update frozen component identities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_tikz_native_component_revisions.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "0867601c1e5ed7df180ce64ee825844a688d942a325df5b77bca6b1734ed1525":
                  "70c2c21e28f1cee03e834244006da779b4e4936dc7ec13aaa67e6f0005fea213",
              "db0e6167bbd0fd472cb83eaa48629b936a995a331cfd12c17fabf7b345cbff0e":
                  "c6b0d8517089b60f5ec6156ab1ee4bcbfb2131629fba31a136ca6f5b3512c63c",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"expected one frozen digest {old}, found {count}"
                  )
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          python -m py_compile tests/test_tikz_native_component_revisions.py

      - name: Commit snapshot update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_tikz_native_component_revisions.py
          git commit -m "test: freeze updated quadric component identities"
          git push origin HEAD:codex/quadrics-v1
