name: Agent PR7B full test log

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full:
    if: github.head_ref == 'agent/open-face-unified-manim-binding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dvisvgm ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            poppler-utils texlive-fonts-recommended texlive-lang-chinese \
            texlive-latex-extra texlive-xetex
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run full tests
        continue-on-error: true
        run: |
          python -m unittest discover -v -s tests -p 'test_*.py' > pr7b-full.log 2>&1 || true
          tail -n 800 pr7b-full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7b-full-log-${{ github.sha }}
          path: pr7b-full.log
          retention-days: 1
